<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Londi Agent OS — Runtime Dashboard Preview</title>
  <script type="importmap">
    {
      "imports": {
        "@londi-agent-os/contracts": "/packages/contracts/src/index.js?v=runtime-dashboard-preview-1"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg-0:#05070d;
      --bg-1:#08111f;
      --panel:#101827cc;
      --panel-strong:#121d30f2;
      --card:#152238d9;
      --line:#8fb7ff24;
      --line-strong:#9bc6ff44;
      --text:#f4f8ff;
      --muted:#96a7bf;
      --faint:#627089;
      --brand:#7dd3fc;
      --brand-2:#c6f6d5;
      --accent:#f8d47b;
      --danger:#fb7185;
      --shadow:0 28px 90px rgba(0,0,0,.42);
      --radius-xl:30px;
      --radius-lg:22px;
      font-family:"IBM Plex Sans Hebrew","Noto Sans Hebrew","Assistant","Segoe UI",sans-serif;
      background:var(--bg-0);
      color:var(--text);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 82% -8%, rgba(125,211,252,.30), transparent 34%),
        radial-gradient(circle at 4% 18%, rgba(248,212,123,.12), transparent 30%),
        linear-gradient(145deg,#05070d 0%,#091424 46%,#05070d 100%);
      overflow-x:hidden;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.18;
      background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(circle at 50% 0%, black, transparent 72%);
    }
    main { position:relative; max-width:1240px; margin:0 auto; padding:34px 24px 72px; }
    .runtime-controls { border:1px solid var(--line); background:rgba(10,18,32,.82); border-radius:24px; padding:16px 18px; margin-bottom:22px; color:#cbd5e1; display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:end; direction:ltr; text-align:left; box-shadow:var(--shadow); backdrop-filter:blur(18px); }
    .runtime-controls[hidden] { display:none; }
    .runtime-controls label { display:grid; gap:6px; color:var(--muted); font-size:13px; }
    .runtime-controls input { width:100%; border:1px solid var(--line); border-radius:14px; padding:12px 13px; background:#0b1220; color:var(--text); outline:none; }
    .runtime-controls input:focus { border-color:var(--brand); box-shadow:0 0 0 4px rgba(125,211,252,.12); }
    .runtime-status { min-height:22px; margin:0 0 18px; color:#a9d8ff; direction:ltr; text-align:left; font-size:13px; letter-spacing:.02em; }
    .phase2-dashboard { direction:ltr; text-align:left; display:grid; gap:18px; }
    .phase2-dashboard__header {
      position:relative;
      overflow:hidden;
      display:flex;
      justify-content:space-between;
      gap:26px;
      align-items:flex-start;
      padding:30px;
      border:1px solid var(--line-strong);
      border-radius:34px;
      background:linear-gradient(135deg,rgba(18,29,48,.96),rgba(9,17,31,.88));
      box-shadow:var(--shadow);
      backdrop-filter:blur(22px);
    }
    .phase2-dashboard__header::after { content:""; position:absolute; inset:auto -90px -130px auto; width:330px; height:330px; border-radius:999px; background:radial-gradient(circle,rgba(125,211,252,.24),transparent 66%); }
    h1 { margin:0 0 8px; font-size:clamp(34px,5vw,58px); line-height:.95; letter-spacing:-.065em; }
    h2 { margin:0 0 16px; font-size:14px; color:#dce9ff; letter-spacing:.16em; text-transform:uppercase; }
    p { margin:0; color:var(--muted); }
    dl { position:relative; z-index:1; margin:0; display:grid; grid-template-columns:auto auto; gap:8px 14px; font-size:13px; padding:14px; border:1px solid var(--line); border-radius:20px; background:rgba(5,9,16,.36); }
    dt { color:var(--faint); } dd { margin:0; color:#eef6ff; font-weight:800; }
    [data-tone="green"] { color:#86efac; } [data-tone="blue"] { color:#7dd3fc; } [data-tone="purple"] { color:#d8b4fe; } [data-tone="amber"] { color:#fde68a; } [data-tone="red"] { color:#fb7185; }
    .phase2-dashboard__alert { padding:14px 16px; border:1px solid rgba(251,113,133,.35); border-radius:18px; background:rgba(127,29,29,.28); color:#fecdd3; }
    .phase2-dashboard__metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .phase2-dashboard__metrics article { position:relative; overflow:hidden; padding:18px; border:1px solid var(--line); border-radius:24px; background:linear-gradient(180deg,rgba(21,34,56,.78),rgba(10,17,30,.70)); box-shadow:0 16px 42px rgba(0,0,0,.22); }
    .phase2-dashboard__metrics article::before { content:""; position:absolute; inset:0 0 auto; height:2px; background:linear-gradient(90deg,var(--brand),transparent); opacity:.75; }
    .phase2-dashboard__metrics span { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.12em; margin-bottom:10px; }
    .phase2-dashboard__metrics strong { font-size:34px; letter-spacing:-.04em; }
    .phase2-dashboard__toolbar { display:flex; flex-wrap:wrap; gap:10px; padding:12px; border:1px solid var(--line); border-radius:24px; background:rgba(5,9,16,.50); backdrop-filter:blur(18px); }
    button { border:0; border-radius:999px; padding:11px 18px; font-weight:900; color:#04111d; background:linear-gradient(135deg,#d9f99d,#7dd3fc); cursor:pointer; box-shadow:0 10px 28px rgba(125,211,252,.18); transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease; }
    button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 16px 36px rgba(125,211,252,.26); }
    button:active:not(:disabled) { transform:translateY(0); }
    button:disabled { opacity:.44; cursor:not-allowed; background:#566276; color:#cbd5e1; box-shadow:none; }
    .phase2-dashboard__section { padding:22px; border:1px solid var(--line); border-radius:26px; background:linear-gradient(180deg,rgba(16,24,39,.70),rgba(9,15,27,.58)); box-shadow:0 18px 56px rgba(0,0,0,.22); }
    .phase2-dashboard__section > div { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .phase2-dashboard__item { display:flex; flex-direction:column; gap:7px; min-height:78px; padding:16px; border:1px solid rgba(143,183,255,.14); border-radius:18px; background:rgba(21,34,56,.62); }
    .phase2-dashboard__item strong { color:#f8fafc; } .phase2-dashboard__item span { color:var(--muted); font-size:13px; }
    .phase2-dashboard__section[data-section-id="new-run"] { padding:0; border:0; background:transparent; box-shadow:none; }
    .phase2-dashboard__section[data-section-id="new-run"] > h2 { margin:0 0 12px 4px; color:#9ecbff; }
    .phase2-dashboard__chat { position:relative; overflow:hidden; border:1px solid var(--line-strong); border-radius:32px; background:linear-gradient(150deg,rgba(18,29,48,.98),rgba(8,14,26,.94)); box-shadow:0 30px 100px rgba(0,0,0,.42); padding:18px; }
    .phase2-dashboard__chat::before { content:""; position:absolute; inset:-120px auto auto -120px; width:260px; height:260px; border-radius:999px; background:radial-gradient(circle,rgba(248,212,123,.16),transparent 70%); }
    .phase2-dashboard__chat-header { position:relative; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 4px 16px; border-bottom:1px solid rgba(143,183,255,.16); }
    .phase2-dashboard__chat-header strong { font-size:24px; letter-spacing:-.04em; color:#ffffff; }
    .phase2-dashboard__chat-header span { color:#03101c; background:linear-gradient(135deg,#fde68a,#86efac); border-radius:999px; padding:7px 11px; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.08em; }
    .phase2-dashboard__chat-messages { position:relative; display:grid; gap:12px; min-height:128px; padding:18px 4px; }
    .phase2-dashboard__chat-empty { width:max-content; max-width:100%; padding:14px 16px; border:1px dashed rgba(143,183,255,.30); border-radius:18px; color:#b7c7dc; background:rgba(125,211,252,.06); }
    .phase2-dashboard__chat-message { justify-self:end; max-width:min(760px,92%); padding:14px 16px; border:1px solid rgba(125,211,252,.34); border-radius:22px 22px 6px 22px; background:linear-gradient(135deg,rgba(125,211,252,.20),rgba(134,239,172,.10)); color:#f8fbff; box-shadow:0 16px 38px rgba(0,0,0,.24); }
    .phase2-dashboard__chat-message span { display:block; font-size:15px; line-height:1.55; }
    .phase2-dashboard__chat-message time { display:block; margin-top:8px; color:#94a3b8; font-size:11px; }
    .phase2-dashboard__chat-composer { position:relative; display:grid; gap:8px; padding:14px; border:1px solid rgba(143,183,255,.20); border-radius:24px; background:rgba(3,8,16,.72); }
    .phase2-dashboard__chat-composer span { color:#9fb2ca; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.12em; }
    .phase2-dashboard__chat textarea { width:100%; min-height:92px; resize:vertical; border:0; outline:none; border-radius:18px; padding:15px 16px; background:rgba(255,255,255,.06); color:#fff; font:inherit; line-height:1.55; box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }
    .phase2-dashboard__chat textarea:focus { box-shadow:inset 0 0 0 1px var(--brand),0 0 0 5px rgba(125,211,252,.12); }
    .phase2-dashboard__chat textarea::placeholder { color:#7f8da3; }
    .phase2-dashboard__chat button[data-control-id="create-manual-run"] { position:relative; margin-top:12px; width:100%; padding:14px 20px; font-size:15px; }
    @media (max-width: 860px) { main { padding:24px 14px 56px; } .runtime-controls { grid-template-columns:1fr; } .phase2-dashboard__header { flex-direction:column; border-radius:28px; } .phase2-dashboard__metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } .phase2-dashboard__chat-message { max-width:100%; } }
  </style>
</head>
<body>
  <main>
    <div class="runtime-note" dir="rtl" style="text-align:right">
      תצוגת Runtime Dashboard: הדף הזה מרכיב את <code>createRuntimeDashboardApp()</code>, לא את ה-DOM Binder ישירות. אין polling ואין קריאת רשת בזמן טעינת הדף.
    </div>
    <section class="runtime-controls" aria-label="Runtime Local API connection">
      <label>Local API token
        <input id="token" type="password" autocomplete="off" placeholder="Paste bearer token from Credential Manager / dev shell" />
      </label>
      <label>Base URL
        <input id="base-url" type="url" value="http://127.0.0.1:3210/api/v1" />
      </label>
      <button id="mount" type="button">Mount Runtime Dashboard</button>
    </section>
    <p id="runtime-status" class="runtime-status">Waiting for token. Serve this file from http://127.0.0.1:3211.</p>
    <div id="phase2-dashboard-root"></div>
  </main>
  <script type="module">
    import { createRuntimeDashboardApp } from '/apps/ui/src/index.js?v=runtime-dashboard-preview-1';

    const status = document.querySelector('#runtime-status');
    const tokenInput = document.querySelector('#token');
    const baseUrlInput = document.querySelector('#base-url');
    const mountButton = document.querySelector('#mount');
    let app = null;

    mountButton.addEventListener('click', () => {
      const token = tokenInput.value.trim();
      const baseUrl = baseUrlInput.value.trim();
      if (!token) {
        status.textContent = 'Token is required before mounting.';
        return;
      }
      app?.unmount?.();
      app = createRuntimeDashboardApp({ token, baseUrl, documentRef: document, target: '#phase2-dashboard-root' });
      const mounted = app.mount();
      status.textContent = `Mounted ${mounted.appId} through ${mounted.binderId}. Click Load or Refresh to call ${baseUrl}.`;
    });
  </script>
</body>
</html>
